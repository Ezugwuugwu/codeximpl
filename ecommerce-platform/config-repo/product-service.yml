server:
  port: 8082
  tomcat:
    # Allow large JSON payloads (product creation with base64 images).
    max-http-form-post-size: 26214400   # 25 MB
    max-swallow-size: 26214400          # 25 MB

security:
  jwt:
    secret: ${JWT_SECRET}

spring:
  main:
    lazy-initialization: false
  mvc:
    servlet:
      load-on-startup: 1
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/product_db}
    username: ${SPRING_DATASOURCE_USERNAME:product_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:product_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
