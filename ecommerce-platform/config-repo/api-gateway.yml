server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET}

spring:
  codec:
    # Allow large JSON payloads (product creation with base64 images — up to 8 × ~3 MB).
    max-in-memory-size: 25MB
  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@userOrIpKeyResolver}"
            redis-rate-limiter.replenishRate: 30
            redis-rate-limiter.burstCapacity: 60
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/${segment}
            - name: CircuitBreaker
              args:
                name: userServiceCircuit
                fallbackUri: forward:/fallback/user-service

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/${segment}
            - name: CircuitBreaker
              args:
                name: productServiceCircuit
                fallbackUri: forward:/fallback/product-service

        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/api/v1/cart/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/${segment}
            - name: CircuitBreaker
              args:
                name: cartServiceCircuit
                fallbackUri: forward:/fallback/cart-service

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/${segment}
            - name: CircuitBreaker
              args:
                name: orderServiceCircuit
                fallbackUri: forward:/fallback/order-service

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/${segment}
            - name: CircuitBreaker
              args:
                name: paymentServiceCircuit
                fallbackUri: forward:/fallback/payment-service

        - id: support-service
          uri: lb://admin-service
          predicates:
            - Path=/api/v1/support/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/${segment}
            - name: CircuitBreaker
              args:
                name: adminServiceCircuit
                fallbackUri: forward:/fallback/admin-service

        - id: admin-service
          uri: lb://admin-service
          predicates:
            - Path=/api/v1/admin/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/${segment}
            - name: CircuitBreaker
              args:
                name: adminServiceCircuit
                fallbackUri: forward:/fallback/admin-service

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - name: CircuitBreaker
              args:
                name: notificationServiceCircuit
                fallbackUri: forward:/fallback/notification-service

        - id: product-ws
          uri: lb:ws://product-service
          predicates:
            - Path=/ws-inventory/**

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

resilience4j:
  circuitbreaker:
    instances:
      userServiceCircuit:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
      productServiceCircuit:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
      orderServiceCircuit:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
      cartServiceCircuit:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
      paymentServiceCircuit:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
      adminServiceCircuit:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
      notificationServiceCircuit:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50

cors:
  # Comma-separated list of allowed origins. Defaults to * (permissive) if not set.
  # Override in production: CORS_ALLOWED_ORIGINS=https://okangamart.com
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

management:
  endpoint:
    health:
      show-details: always
