server:
  port: 8085

security:
  jwt:
    secret: ${JWT_SECRET}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/payment_db}
    username: ${SPRING_DATASOURCE_USERNAME:payment_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:payment_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}

payment:
  paystack:
    api-base-url: ${PAYSTACK_API_BASE_URL:https://api.paystack.co}
    secret-key: ${PAYSTACK_SECRET_KEY:}
    public-key: ${PAYSTACK_PUBLIC_KEY:}
